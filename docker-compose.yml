services:
  mysql:
    image: mysql:8.0
    container_name: mfg-db
    environment:
      MYSQL_ROOT_PASSWORD: mfg_root
      MYSQL_DATABASE: mfg
      MYSQL_USER: mfg
      MYSQL_PASSWORD: mfg_dev
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysqldata:
